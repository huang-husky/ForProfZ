<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一封信</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Ma Shan Zheng', cursive, sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      color: #333;
      line-height: 1.8;
      overflow-x: hidden;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      animation: fadeIn 1.5s ease-out;
      position: relative;
      border: 1px solid #e0e7e8;
      display: none;
    }
    .container::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px dashed #cfd8dc;
      border-radius: 15px;
      pointer-events: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .header { text-align: center; margin-bottom: 40px; position: relative; }
    .header h1 {
      font-size: 2.5rem; font-weight: 600; color: #2c5282;
      animation: slideInLeft 1s ease-out;
    }
    .header p {
      margin-top: 0; margin-bottom: 20px; font-size: 1.5rem; color: #4a5568;
      text-align: left;
      animation: slideInRight 1s ease-out 0.3s;
    }
    .paragraph {
      margin-bottom: 25px; text-indent: 2em;
      animation: floatUp 1s ease-out forwards;
      opacity: 0;
    }
    .signature {
      text-align: right; margin-top: 50px; font-style: italic; color: #718096;
      animation: fadeIn 1.5s ease-out 2s;
    }
    .signature .name { font-size: 1.2rem; font-weight: 600; margin-top: 10px; }
    .signature .date { font-size: 1rem; margin-top: 5px; }

    @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes floatUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
      .container { margin: 20px; padding: 20px; }
      .header h1 { font-size: 2rem; }
      .header p { font-size: 1.2rem; }
      .paragraph { margin-bottom: 20px; }
    }

    /* 密码输入界面 */
    .gate {
      min-height: 80vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      animation: fadeIn 1s ease-out;
      padding: 20px;
    }
    .gate h2 { font-size: 1.8rem; color: #2c5282; margin-bottom: 24px; }
    .gate input {
      font-family: Inter, sans-serif;
      font-size: 1rem;
      padding: 12px 16px;
      border: 1px solid #cfd8dc;
      border-radius: 10px;
      width: 260px;
      max-width: 80vw;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    .gate input:focus { border-color: #2c5282; }
    .gate button {
      margin-top: 16px;
      padding: 10px 32px;
      font-size: 1.1rem;
      font-family: inherit;
      color: #fff;
      background-color: #2c5282;
      border: none; border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .gate button:hover { background-color: #3a6ea5; transform: translateY(-1px); }
    .gate button:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .gate .hint { margin-top: 14px; color: #c00; font-size: 0.95rem; min-height: 1.4em; }

    .music-control-button {
      position: fixed; bottom: 20px; right: 20px;
      background-color: #a7d9b5; color: #2c5282;
      padding: 10px 15px; border-radius: 10px;
      border: 1px solid #82b09a; cursor: pointer;
      font-size: 0.9rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease-in-out;
      display: none;
      align-items: center; justify-content: center;
      z-index: 1000;
    }
    .music-control-button:hover { background-color: #82b09a; color: #fff; transform: translateY(-2px); }
    .music-control-button .icon { margin-right: 8px; font-size: 1.1rem; }
  </style>
</head>
<body>

<!-- 密码输入界面 -->
<div class="gate" id="gate">
  <h2>这里有一封信</h2>
  <input type="password" id="pwInput" placeholder="请输入访问密码" autocomplete="off">
  <button id="unlockBtn">开启</button>
  <p class="hint" id="hint"></p>
</div>

<!-- 信件容器：内容由解密后动态注入，源码中不存在明文 -->
<div class="container" id="letterBox"></div>

<audio id="backgroundMusic" loop>
  <source src="C418 - Minecraft.mp3" type="audio/mpeg">
</audio>

<button id="musicToggleButton" class="music-control-button">
  <span class="icon">♪</span>
  <span id="musicStatusText">暂停音乐</span>
</button>

<script>

  const b64ToBuf = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function decrypt(password) {
    const [saltB64, ivB64, ctB64] = ENCRYPTED.split('.');
    const salt = b64ToBuf(saltB64);
    const iv = b64ToBuf(ivB64);
    const ct = b64ToBuf(ctB64);

    const baseKey = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false, ['decrypt']
    );
    // 密码错误时 AES-GCM 校验失败，这里会抛出异常
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return new TextDecoder().decode(plainBuf);
  }

  const gate = document.getElementById('gate');
  const pwInput = document.getElementById('pwInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const hint = document.getElementById('hint');
  const letterBox = document.getElementById('letterBox');
  const audio = document.getElementById('backgroundMusic');
  const musicToggleButton = document.getElementById('musicToggleButton');
  const musicStatusText = document.getElementById('musicStatusText');
  let isPlaying = false;

  async function tryUnlock() {
    const pw = pwInput.value.trim();
    if (!pw) { hint.textContent = '请输入密码'; return; }
    unlockBtn.disabled = true;
    hint.textContent = '';
    try {
      const html = await decrypt(pw);
      // 解密成功：注入信件内容，切换界面
      letterBox.innerHTML = html;
      gate.style.display = 'none';
      letterBox.style.display = 'block';
      document.title = letterBox.querySelector('h1')?.textContent || document.title;

      // 借助本次点击（用户交互）启动背景音乐，成功率远高于 autoplay
      musicToggleButton.style.display = 'flex';
      audio.volume = 1.0;
      audio.play().then(() => {
        isPlaying = true;
        musicStatusText.textContent = '暂停音乐';
      }).catch(() => {
        isPlaying = false;
        musicStatusText.textContent = '播放音乐';
      });
    } catch (e) {
      hint.textContent = '密码错误，请重试';
      pwInput.select();
    } finally {
      unlockBtn.disabled = false;
    }
  }

  unlockBtn.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

  musicToggleButton.addEventListener('click', () => {
    if (isPlaying) {
      audio.pause();
      musicStatusText.textContent = '播放音乐';
      isPlaying = false;
    } else {
      audio.play().then(() => {
        musicStatusText.textContent = '暂停音乐';
        isPlaying = true;
      }).catch(() => {
        musicStatusText.textContent = '播放失败 (点击以重试)';
      });
    }
  });
</script>
</body>
</html>
